# Dependency advisories (SPEC decisions 36 and 65). Runs weekly and by hand (both once this
# file is on main), and on every push to a pull request whose changes include this file,
# deny.toml or Cargo.lock; it is never a required check. A failed scheduled or manual run
# opens one issue, or comments on the open one.
name: Advisories

on:
  schedule:
    - cron: "23 6 * * 1" # Mondays, 06:23 UTC (not the top of the hour, a high-load time)
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/advisories.yml
      - deny.toml
      - Cargo.lock

permissions:
  contents: read
  issues: write

# Scheduled and manual runs share one group: a later run waits for the one in progress (a run
# still waiting is replaced by a newer one, GitHub's default), so two failing runs cannot
# both find no open issue and both open one. A pull-request run opens no issue and gets a
# group of its own.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.run_id || 'report' }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  advisories:
    name: cargo deny check advisories
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install --no-self-update
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-deny@0.20.2
      - name: Check the RustSec advisory database
        id: check
        timeout-minutes: 10
        run: cargo deny --locked check advisories
      # One issue per failure streak: comment while one with exactly this title is open,
      # create when there is none. Runs on any failed step of a scheduled or manual run (a
      # broken checkout or install must not fail silently for weeks; the check step has its
      # own 10-minute timeout, so a hang there fails the step and is reported, while a job
      # cancelled by its 15-minute timeout opens no issue); skipped on pull requests, where
      # the red check is already visible.
      - name: Open or update the advisories issue
        if: ${{ failure() && github.event_name != 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title='cargo deny check advisories failed'
          printf -v body '%s\n\n%s\n' \
            "The advisories workflow failed: $RUN_URL" \
            'Read the run log. For an advisory, bump the dependency or add an ignore entry to deny.toml with its id, a reason and when to revisit it (SPEC decision 65).'
          number=$(gh issue list --state open --limit 200 --json number,title --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
