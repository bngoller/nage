# The licence check runs in CI on every pull request and is the gate a merge requires; the
# advisory check runs weekly in advisories.yml (once that file is on main) and opens an
# issue; it is never a required check (SPEC decisions 36, 64 and 65).
[licenses]
# Dev-dependencies are licence-checked too (SPEC decision 63); build-dependencies are
# checked by default in cargo-deny 0.20 (include-build defaults to true), so no key for them.
include-dev = true
# Our own crates are AGPL-3.0-or-later and never published; unpublished crates are skipped,
# so `allow` describes dependencies only. It starts empty and grows one deliberate line
# at a time, in the slice that adds the dependency.
private = { ignore = true }
allow = [
  "Apache-2.0", # sync_wrapper (via axum), Apache-2.0 only; milestone 1 slice 2
  "BSD-3-Clause", # matchit (via axum), "MIT AND BSD-3-Clause"; milestone 1 slice 2
  "MIT", # axum; milestone 1 slice 2
  "Unicode-3.0", # unicode-ident (via proc-macro2), "(MIT OR Apache-2.0) AND Unicode-3.0"; milestone 1 slice 2; unicode-normalization (nage-core), the same expression; milestone 2 slice 3
  "Zlib", # foldhash (via hashbrown, via sqlx-core); milestone 1 slice 3
]

# Advisories with cargo-deny's defaults: every vulnerability and every unmaintained crate in
# the dependency graph fails the check, an unsound advisory fails for a direct dependency, a
# yanked crate warns. An ignore is a maintainer decision: it names the advisory, the reason
# and when to revisit it, never an addition in passing; cargo-deny warns once an entry stops
# matching (SPEC decision 65).
[advisories]
ignore = [
  # basic-toml 0.1.10 is archived upstream and has no upgrade; the advisory's suggested
  # replacement (toml) is for askama to adopt. It reaches us only through askama_derive
  # 0.16.1 (askama's configuration parser): build-time only, never in the binary. Revisit
  # when askama is bumped.
  { id = "RUSTSEC-2026-0374", reason = "unmaintained basic-toml inside askama's proc-macro, build-time only; no upgrade available (2026-10-29)" },
  # SQLite before 3.54.0 can return uninitialized page-cache memory when a database file is
  # opened together with a crafted sibling -wal file whose page size differs: a local vector,
  # since the victim must open the pair. libsqlite3-sys 0.37.0 bundles SQLite 3.51.3 and is
  # affected; the fix is libsqlite3-sys 0.39 (SQLite 3.54), but sqlx-sqlite 0.9.0 requires
  # libsqlite3-sys below 0.38, and no newer sqlx exists. Nage opens only the database of its
  # own data directory; its tests and xtask seed open only databases they create and copies
  # of the committed fixtures, and SQLite deletes a -wal beside an empty database before
  # reading it, so no -wal file a less trusted party wrote is read beside a database Nage
  # opens. Revisit when sqlx allows libsqlite3-sys 0.39, and at each milestone pull request's
  # pin re-resolution.
  { id = "RUSTSEC-2026-0459", reason = "SQLite 3.51.3 bundled by libsqlite3-sys 0.37.0, which sqlx-sqlite 0.9.0 requires below 0.38; a crafted sibling -wal file is a local vector, and Nage opens only its own data directory's database, its tests and xtask seed only databases they create and fixture copies; revisit when sqlx allows 0.39 (2026-11-09)" },
]
