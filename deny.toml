# The license check blocks merges; the advisory check runs on a schedule (SPEC decision 36).
# Only `cargo deny check licenses` runs today, so only [licenses] is configured.
[licenses]
# Dev-dependencies are licence-checked too (SPEC decision 63); build-dependencies are
# checked by default in cargo-deny 0.20 (include-build defaults to true), so no key for them.
include-dev = true
# Our own crates are AGPL-3.0-or-later and never published; unpublished crates are skipped,
# so `allow` describes dependencies only. It starts empty and grows one deliberate line
# at a time, in the slice that adds the dependency.
private = { ignore = true }
allow = [
  "Apache-2.0", # sync_wrapper (via axum), Apache-2.0 only; milestone 1 slice 2
  "BSD-3-Clause", # matchit (via axum), "MIT AND BSD-3-Clause"; milestone 1 slice 2
  "MIT", # axum; milestone 1 slice 2
  "Unicode-3.0", # unicode-ident (via proc-macro2), "(MIT OR Apache-2.0) AND Unicode-3.0"; milestone 1 slice 2
  "Zlib", # foldhash (via hashbrown, via sqlx-core); milestone 1 slice 3
]
