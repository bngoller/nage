[package]
name = "nage-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Shared test helpers (`nage_core::test_support`), enabled only by dev-dependencies, so a
# production build never carries them (SPEC decision 59).
test-support = ["dep:tempfile", "dep:proptest"]

[dependencies]
proptest = { workspace = true, optional = true }
sqlx.workspace = true
tempfile = { workspace = true, optional = true }

[dev-dependencies]
# Itself, with the helpers on, so its own unit and integration tests see them (SPEC decision 59).
nage-core = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
