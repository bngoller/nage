<div class="field">
<label for="date">Date</label>
<input type="date" id="date" name="date" value="{{ typed.date }}" min="1900-01-01" max="{{ today }}"{% if problems.date.is_some() %} aria-invalid="true"{% endif %}>
{% if self.helps() %}
<small class="help">Not after today, {{ today }}.</small>
{% endif %}
{% if let Some(problem) = problems.date %}
<small class="problem">{{ problem }}</small>
{% endif %}
</div>
<div class="field">
<label for="amount">{{ self.amount_label() }}</label>
<input type="text" id="amount" name="amount" value="{{ typed.amount }}" inputmode="decimal" autocomplete="off"{% if problems.amount.is_some() %} aria-invalid="true"{% endif %}>
{% if self.helps() %}
<small class="help">{{ self.amount_help() }}</small>
{% endif %}
{% if let Some(problem) = problems.amount %}
<small class="problem">{{ problem }}</small>
{% endif %}
<label class="tick"><input type="checkbox" name="below_zero" value="1"{% if typed.below_zero %} checked{% endif %}> {{ self.tick_label() }}</label>
</div>
